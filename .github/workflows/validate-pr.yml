name: Validate Project Submission PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'content/projects/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Security & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate PR Changes & Generate Review Card
        id: validator
        run: |
          python -c "
          import sys, re, os, json
          from pathlib import Path

          content_dir = Path('content/projects')
          md_files = [f for f in content_dir.glob('*.md') if f.name != '_template.md']
          
          if not md_files:
              print('No project markdown files found!')
              sys.exit(1)

          errors = []
          authors = {}
          summary_cards = []

          for f in md_files:
              text = f.read_text(encoding='utf-8')
              
              if not text.startswith('---'):
                  errors.append(f'{f.name}: Missing frontmatter opening delimiter (---)')
                  continue
              
              if '<script' in text.lower():
                  errors.append(f'{f.name}: Malicious or unsafe `<script>` tags are strictly prohibited.')

              if 'name:' not in text:
                  errors.append(f'{f.name}: Missing required field `name:`')
              if 'repo_url:' not in text:
                  errors.append(f'{f.name}: Missing required field `repo_url:`')
              if 'author:' not in text:
                  errors.append(f'{f.name}: Missing required field `author:`')
              
              url_match = re.search(r'repo_url:\s*[\"\']?(https://github\.com/([a-zA-Z0-9_-]+)/([a-zA-Z0-9._-]+))[\"\']?', text)
              if not url_match:
                  errors.append(f'{f.name}: Invalid GitHub `repo_url` (must be https://github.com/owner/repository)')
              
              name_match = re.search(r'name:\s*[\"\']?([^\"\n\r]+)[\"\']?', text)
              author_match = re.search(r'author:\s*[\"\']?@?([a-zA-Z0-9_-]+)[\"\']?', text)
              batch_match = re.search(r'batch:\s*[\"\']?([^\"\n\r]+)[\"\']?', text)
              tech_match = re.search(r'tech_stack:\s*\[(.*?)\]', text)
              
              if author_match:
                  author_name = author_match.group(1)
                  authors[author_name.lower()] = authors.get(author_name.lower(), 0) + 1
                  if authors[author_name.lower()] > 3:
                      errors.append(f'{f.name}: Author @{author_name} has exceeded the limit of 3 featured campus projects.')

              proj_name = name_match.group(1).strip() if name_match else f.stem
              repo_url = url_match.group(1).strip() if url_match else 'N/A'
              author_str = author_match.group(1).strip() if author_match else 'Unknown'
              batch_str = batch_match.group(1).strip() if batch_match else '2026'
              tech_str = tech_match.group(1).strip() if tech_match else 'Code'

              summary_cards.append(f'''
          ### 📋 Project Review Summary for Maintainers
          - **Project Name:** {proj_name}
          - **Submitted by:** @{author_str} (Batch: {batch_str})
          - **Repository:** [{repo_url}]({repo_url})
          - **Tech Stack:** `{tech_str}`

          #### ✅ Maintainer Verification Checklist:
          - [ ] Repository is public and contains actual code (not an empty repo).
          - [ ] Repository has a basic README explaining how to run it.
          - [ ] Contributor is an authentic RIT student.
          - [ ] Project is not an unmodified duplicate fork.
          ''')

          if errors:
              print('❌ Validation Errors Found:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)

          # Write summary for PR comment
          with open('pr_summary.md', 'w', encoding='utf-8') as sf:
              sf.write('\n\n'.join(summary_cards))

          print(f'✅ All {len(md_files)} project files passed syntax and security checks!')
          "

      - name: Post Review Summary Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_summary.md')) {
              const summary = fs.readFileSync('pr_summary.md', 'utf8');
              const commentBody = `${summary}\n\n*🤖 Auto-generated review card to help junior maintainers cross-verify submissions.*`;
              
              // Check if bot already commented to avoid duplicate spam
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.data.find(c => c.body.includes('Project Review Summary for Maintainers'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
              }
            }
