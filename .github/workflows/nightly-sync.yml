name: Nightly GitHub Telemetry & XP Sync

on:
  schedule:
    # Runs every night at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync Stars, Forks & Leaderboard XP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telemetry & XP Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_data.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/ frontend/public/data/
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): auto-sync GitHub stars, forks & leaderboard XP [skip ci]"
            git push origin main
          fi
